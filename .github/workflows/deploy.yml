name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No version here on purpose: package.json pins packageManager (pnpm@10.32.1),
      # and passing version too makes pnpm/action-setup fail with "multiple versions".
      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # SPA fallback so deep links resolve on GitHub Pages.
      - run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: jialinhuangblog/mte
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: mte.jialin00.com
